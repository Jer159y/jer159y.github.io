- title: Research experience
  type: time_table
  contents:
    - title: Ensemble reservoir computing for long-horizon prediction
      institution: Graduate research project
      year: Ongoing
      description:
        - Designing parallel ensemble rollouts and periodic resynchronisation of members for nonlinear dynamical systems, without retraining reservoir weights.
        - Developing long-horizon diagnostics such as ensemble health and effective-support proxies for systems including Duffing, Kuramoto–Sivashinsky, and Lorenz-96.
    - title: DynamicsMetrics.jl
      institution: Open-source Julia research software
      year: Early release
      description:
        - Evaluation toolkit for dynamical-system prediction covering pointwise error, forecast horizon, temporal and spectral structure, distributional distance, and ensemble uncertainty.
        - Includes input validation, reproducible TOML reports, examples, and unit tests.

