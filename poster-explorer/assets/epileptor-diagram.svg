<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-labelledby="title description">
  <title id="title">Epileptor 참조 모형</title>
  <desc id="description">숨은 흥분도 x0가 여섯 상태의 Epileptor에 들어가고 관측 신호 x2 마이너스 x1이 출력된다. 신호는 정상 구간 파랑, 발작 유사 이탈 구간 빨강으로 표시된다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#66808d"/></marker></defs>
  <rect x="1" y="1" width="438" height="218" rx="15" fill="#f7fafb" stroke="#dce5e8"/>
  <text x="22" y="29" fill="#49616b" font-size="13" font-weight="700">참조 모형 · Ground truth</text>
  <rect x="20" y="73" width="88" height="73" rx="11" fill="#eef3fb" stroke="#9bb8d8"/>
  <text x="64" y="102" text-anchor="middle" fill="#255d9f" font-size="21" font-weight="700">x₀</text>
  <text x="64" y="123" text-anchor="middle" fill="#516b78" font-size="11">숨은 흥분도</text>
  <path d="M111 109H145" stroke="#66808d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="57" width="142" height="105" rx="12" fill="#fff" stroke="#91aab5" stroke-width="1.5"/>
  <text x="221" y="88" text-anchor="middle" fill="#163a4b" font-size="18" font-weight="700">Epileptor</text>
  <text x="221" y="113" text-anchor="middle" fill="#59717c" font-size="11">x₁ · y₁ · z · x₂ · y₂ · g</text>
  <text x="221" y="136" text-anchor="middle" fill="#59717c" font-size="11">빠른·느린 동역학</text>
  <path d="M296 109H323" stroke="#66808d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="328" y="72" width="92" height="74" rx="11" fill="#fff" stroke="#b9cbd2"/>
  <path d="M339 113l8-3 5-17 5 25 7-8 7-4 7-19 5 28 7-5" fill="none" stroke="#1769b3" stroke-width="2" stroke-linecap="round"/>
  <path d="M390 110l6 3 3 20 4-9 6 8" fill="none" stroke="#c83a3a" stroke-width="2" stroke-linecap="round"/>
  <text x="374" y="166" text-anchor="middle" fill="#516b78" font-size="12">관측 신호 x₂−x₁</text>
  <text x="220" y="196" text-anchor="middle" fill="#687f89" font-size="11">단일 노드 또는 연결된 3노드를 직접 시뮬레이션</text>
</svg>
